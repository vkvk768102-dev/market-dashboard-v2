# ICI 주간 MMF 총액을 자동으로 받아 data/mmf.json 에 저장한다.
# ICI 는 매주 목요일 오후(미국 동부시간)에 직전 수요일 기준 수치를 발표한다.
name: Update MMF (ICI)

on:
  schedule:
    # 시간은 UTC 기준. 한국시간 = UTC + 9시간
    - cron: "23 22 * * 4" # 금요일 07:23 (한국시간) - 발표 직후
    - cron: "23 14 * * 5" # 금요일 23:23 (한국시간) - 발표가 늦었을 때 대비
    - cron: "23 14 * * 1" # 월요일 23:23 (한국시간) - 공휴일로 밀렸을 때 대비
  workflow_dispatch: {} # Actions 탭에서 "Run workflow" 버튼으로 직접 실행 가능

permissions:
  contents: write

concurrency:
  group: update-mmf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ICI money market fund assets
        run: node scripts/fetch-mmf.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/mmf.json)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mmf.json
          git commit -m "data: update ICI MMF total"
          git pull --rebase
          git push
